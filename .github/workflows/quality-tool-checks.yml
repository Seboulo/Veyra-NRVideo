name: Image quality tool checks
# Checks the held-out-frame quality scorer itself (scripts/quality) on synthetic video.
# Real Veyra exports need the GPU and run on the developer PC, not here.
on:
  push:
    paths: ['scripts/quality/**', '.github/workflows/quality-tool-checks.yml']
  pull_request:
    paths: ['scripts/quality/**', '.github/workflows/quality-tool-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ffmpeg
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
      - name: Install Python packages
        run: python -m pip install -r scripts/quality/requirements.txt
      - name: Self test
        run: python scripts/quality/veyra_quality.py selftest --work "$RUNNER_TEMP/quality-selftest"
